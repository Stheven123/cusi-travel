[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api → backend en Railway
[[redirects]]
  from   = "/api/*"
  to     = "https://cusi-travel-backend-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA fallback — todas las rutas van a index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
