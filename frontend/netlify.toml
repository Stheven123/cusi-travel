[build]
  command = "npm run build"
  publish = "dist"
  # Despliegue automático conectado a GitHub — verificado 2026-08-12

# Proxy /api → backend en Render
[[redirects]]
  from   = "/api/*"
  to     = "https://cusi-travel-backend.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — todas las rutas van a index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
